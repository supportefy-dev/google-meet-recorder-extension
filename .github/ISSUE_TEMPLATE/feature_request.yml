name: Feature request
description: Suggest a focused improvement to the local recorder.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permissions impact
      description: Explain whether this needs a new permission, network request, or stored data.
    validations:
      required: true

