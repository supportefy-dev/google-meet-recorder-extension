name: Bug report
description: Report a reproducible recording or interface problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not attach private meeting recordings.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 4.4.5
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Recording mode
      options:
        - Audio (MP3)
        - Video (WEBM)
        - Both / not mode-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed meeting links, participant information, and private recordings from this report.
          required: true

