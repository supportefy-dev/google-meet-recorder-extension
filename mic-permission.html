<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enable recording microphone</title>
  <link rel="stylesheet" href="mic-permission.css">
</head>
<body>
  <main>
    <span class="mark">⌁</span>
    <small>GOOGLE MEET RECORDER</small>
    <h1>Enable your recording mic</h1>
    <p id="message">This permission is used only to mix your microphone into the recording stored on your device.</p>
    <button id="allowButton"><span>Allow microphone</span><i>→</i></button>
    <footer>◇ Nothing is uploaded or transmitted by this extension.</footer>
  </main>
  <script src="mic-permission.js"></script>
</body>
</html>
